name: Build and release SDK

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
          - runner: macos-14
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.13'
          enable-cache: true
      - name: Check version and tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python tools/release.py check-version --tag "$GITHUB_REF_NAME"
          else
            python tools/release.py check-version
          fi
      - name: Check Python SDK
        working-directory: python
        run: |
          uv sync --locked --all-packages
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src fastapi/src
          uv run --locked pytest -q
          uv build --all-packages --out-dir ../dist/python
      - name: Check release helper
        run: |
          uv run --project python --locked ruff check --config python/pyproject.toml tools/release.py tools/test_release.py tools/verify_maven_consumer.py tools/verify_shared_installation.py
          uv run --project python --locked ruff format --check --config python/pyproject.toml tools/release.py tools/test_release.py tools/verify_maven_consumer.py tools/verify_shared_installation.py
          python -m unittest discover -s tools -p test_release.py
      - name: Build and verify native offline bundle
        run: python tools/release.py wheelhouse --dist dist/python --output dist/bundles
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-${{ matrix.platform }}
          path: |
            dist/python/*
            dist/bundles/*
          if-no-files-found: error
          retention-days: 14

  java:
    name: Java / JDK 21
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check version and tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python tools/release.py check-version --tag "$GITHUB_REF_NAME"
          else
            python tools/release.py check-version
          fi
      - name: Check and build Java SDK
        working-directory: java
        run: ./gradlew --no-daemon check build publishAllPublicationsToVerificationRepository
      - name: Verify executable JAR
        run: java -jar java/license-core/build/libs/license-core-$(python tools/release.py check-version).jar --help
      - name: Package and verify local Maven repository
        shell: bash
        run: |
          python tools/release.py maven --repository java/build/maven-repository --dist java --output dist/java
          sdk_version=$(python tools/release.py check-version)
          mkdir -p "$RUNNER_TEMP/maven-smoke"
          tar -xzf "dist/java/license-sdk-java-maven-$sdk_version.tar.gz" -C "$RUNNER_TEMP/maven-smoke"
          python tools/verify_maven_consumer.py --repository "$RUNNER_TEMP/maven-smoke/license-sdk-java-maven-$sdk_version" --offline
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: java
          path: |
            java/*/build/libs/*.jar
            dist/java/*
          if-no-files-found: error
          retention-days: 14

  posix:
    name: Linux / shared publication and read-only installation
    needs: [python, java]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: java
          path: posix-inputs/java
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-linux-x86_64
          path: posix-inputs/python
      - name: Install only the verified offline SDK bundle
        shell: bash
        run: |
          sdk_version=$(python tools/release.py check-version)
          sdk_bundle=$(find posix-inputs/python -name "license-sdk-python-$sdk_version-cp312-linux-x86_64.tar.gz")
          mkdir -p "$RUNNER_TEMP/posix-sdk"
          tar -xzf "$sdk_bundle" -C "$RUNNER_TEMP/posix-sdk"
          cd "$RUNNER_TEMP/posix-sdk/license-sdk-python-$sdk_version-cp312-linux-x86_64"
          sha256sum -c SHA256SUMS
          python -m venv "$RUNNER_TEMP/posix-venv"
          "$RUNNER_TEMP/posix-venv/bin/python" -m pip install --no-index --find-links=wheelhouse --require-hashes -r requirements-core.txt
      - name: Verify different UIDs, interruption and a read-only bind mount
        shell: bash
        run: |
          sdk_version=$(python tools/release.py check-version)
          sdk_jar=$(find "$GITHUB_WORKSPACE/posix-inputs/java" -name "license-core-$sdk_version.jar")
          sudo env JAVA_HOME="$JAVA_HOME" "$RUNNER_TEMP/posix-venv/bin/python" tools/verify_shared_installation.py --java-jar "$sdk_jar" --work-dir "$RUNNER_TEMP/shared-installation"
          mkdir -p "$RUNNER_TEMP/shared-installation-ro"
          sudo mount --bind "$RUNNER_TEMP/shared-installation" "$RUNNER_TEMP/shared-installation-ro"
          trap 'sudo umount "$RUNNER_TEMP/shared-installation-ro"' EXIT
          sudo mount -o remount,bind,ro "$RUNNER_TEMP/shared-installation-ro"
          sudo env JAVA_HOME="$JAVA_HOME" "$RUNNER_TEMP/posix-venv/bin/python" tools/verify_shared_installation.py --java-jar "$sdk_jar" --work-dir "$RUNNER_TEMP/shared-installation-ro" --check-only

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, java, posix]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-inputs
      - name: Assemble complete release and checksums
        run: python tools/release.py assemble --inputs release-inputs --output release-assets
      - name: Create release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Create a draft first so incomplete uploads are never advertised as a finished release.
          # Existing tags/releases are never overwritten or uploaded with --clobber.
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --draft --title "License SDK $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
