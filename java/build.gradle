plugins { id 'base' }

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'io.metor.license'
    version = '0.4.0'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
        withJavadocJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    publishing {
        publications { mavenJava(MavenPublication) { from components.java } }
        repositories {
            maven {
                name = 'verification'
                url = rootProject.layout.buildDirectory.dir('maven-repository')
            }
        }
    }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
